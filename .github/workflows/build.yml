name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Organize Structure & Build
      run: |
        mkdir -p app/src/main/java/com/aboezzat/castreceiver
        [ -f MainActivity.java ] && cp MainActivity.java app/src/main/java/com/aboezzat/castreceiver/
        [ -f HttpServerService.java ] && cp HttpServerService.java app/src/main/java/com/aboezzat/castreceiver/
        [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
        
        # إنشاء ملف settings.gradle
        printf "rootProject.name = 'AboEzzat-TV-cast'\ninclude ':app'\n" > settings.gradle

        # إنشاء build.gradle للمشروع الأساسي
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # نقل أو تهيئة build.gradle الخاص بالتطبيق
        if [ -f build.gradle.app ]; then
            cp build.gradle.app app/build.gradle
        else
            cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.aboezzat.castreceiver'
            compileSdk 34
            defaultConfig {
                applicationId "com.aboezzat.castreceiver"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        fi

        # إنشاء الـ Wrapper وتشغيل التجميع
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AboEzzat-TV-Receiver
        path: app/build/outputs/apk/debug/*.apk
