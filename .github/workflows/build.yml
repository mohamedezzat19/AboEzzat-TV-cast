name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Organize Structure & Build
      run: |
        # تنظيف أي ملفات gradle قديمة في المجلد الرئيسي لتجنب التضارب
        rm -f build.gradle settings.gradle

        # إنشاء المجلدات الصحيحة لكود الجافا
        mkdir -p app/src/main/java/com/aboezzat/castreceiver
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/aboezzat/castreceiver/
        [ -f HttpServerService.java ] && mv HttpServerService.java app/src/main/java/com/aboezzat/castreceiver/
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/

        # قبول تراخيص أندرويد في بيئة السيرفر
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # إنشاء ملف settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AboEzzat-TV-cast"
        include ':app'
        EOF

        # إنشاء ملف build.gradle الرئيسي
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # إنشاء ملف app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.aboezzat.castreceiver'
            compileSdk 34

            defaultConfig {
                applicationId "com.aboezzat.castreceiver"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # تنزيل واستخدام Gradle 8.2
        if [ ! -d "gradle-8.2" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle-8.2-bin.zip
        fi

        ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AboEzzat-TV-Receiver
        path: app/build/outputs/apk/debug/*.apk
